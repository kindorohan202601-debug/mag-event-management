 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAG - Fixture Management</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #22c55e;
}

.back-btn {
    background: #374151;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.form-box h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

.create-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.create-btn:hover {
    background: #16a34a;
}

.fixture {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.fixture h3 {
    font-size: 22px;
    margin-bottom: 12px;
}

.teams {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.vs {
    color: #22c55e;
    margin: 0 8px;
}

.info {
    color: #6b7280;
    line-height: 1.8;
}

.delete-btn {
    margin-top: 15px;
    background: #ef4444;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
    background: white;
    border-radius: 15px;
}

.note {
    margin-top: 10px;
    color: #6b7280;
    font-size: 14px;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 15px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        MA<span>G</span>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</header>


<div class="container">

    <h1>📅 Fixture Management</h1>

    <p class="subtitle">
        Create and manage matches for your tournaments.
    </p>


    <div class="form-box">

        <h2>➕ Create Fixture</h2>


        <label>Select Tournament</label>

        <select id="tournament" onchange="loadTeams()">

            <option value="">
                Select Tournament
            </option>

        </select>


        <label>Team A</label>

        <select id="teamA">

            <option value="">
                Select Team A
            </option>

        </select>


        <label>Team B</label>

        <select id="teamB">

            <option value="">
                Select Team B
            </option>

        </select>


        <label>Match Date</label>

        <input
            type="date"
            id="matchDate"
        >


        <label>Match Time</label>

        <input
            type="time"
            id="matchTime"
        >


        <label>Venue</label>

        <input
            type="text"
            id="venue"
            placeholder="Example: Bundapani Ground"
        >


        <button
            class="create-btn"
            onclick="createFixture()">

            Create Fixture

        </button>

        <p class="note">
            Select a tournament first to load its registered teams.
        </p>

    </div>


    <h2>📋 Fixtures</h2>

    <br>

    <div id="fixtureList"></div>

</div>


<script>

/* Load existing data */

let tournaments =
    JSON.parse(
        localStorage.getItem("magTournaments")
    ) || [];


let teams =
    JSON.parse(
        localStorage.getItem("magTeams")
    ) || [];


let fixtures =
    JSON.parse(
        localStorage.getItem("magFixtures")
    ) || [];


/* Load tournaments */

function loadTournaments() {

    const select =
        document.getElementById("tournament");

    select.innerHTML =
        '<option value="">Select Tournament</option>';

    tournaments.forEach(tournament => {

        const option =
            document.createElement("option");

        option.value =
            tournament.id;

        option.textContent =
            tournament.name +
            " - " +
            tournament.sport;

        select.appendChild(option);

    });
}


/* Load teams belonging to selected tournament */

function loadTeams() {

    const tournamentId =
        document.getElementById("tournament").value;

    const teamA =
        document.getElementById("teamA");

    const teamB =
        document.getElementById("teamB");


    teamA.innerHTML =
        '<option value="">Select Team A</option>';

    teamB.innerHTML =
        '<option value="">Select Team B</option>';


    if (!tournamentId) {

        return;
    }


    const tournamentTeams =
        teams.filter(
            team =>
                String(team.tournamentId) ===
                String(tournamentId)
        );


    tournamentTeams.forEach(team => {

        const optionA =
            document.createElement("option");

        optionA.value =
            team.id;

        optionA.textContent =
            team.name;

        teamA.appendChild(optionA);


        const optionB =
            document.createElement("option");

        optionB.value =
            team.id;

        optionB.textContent =
            team.name;

        teamB.appendChild(optionB);

    });
}


/* Create fixture */

function createFixture() {

    const tournamentId =
        document.getElementById("tournament").value;

    const teamAId =
        document.getElementById("teamA").value;

    const teamBId =
        document.getElementById("teamB").value;

    const date =
        document.getElementById("matchDate").value;

    const time =
        document.getElementById("matchTime").value;

    const venue =
        document.getElementById("venue").value.trim();


    if (
        !tournamentId ||
        !teamAId ||
        !teamBId ||
        !date ||
        !time ||
        !venue
    ) {

        alert(
            "Please fill in all fixture details."
        );

        return;
    }


    if (teamAId === teamBId) {

        alert(
            "Team A and Team B must be different."
        );

        return;
    }


    const tournament =
        tournaments.find(
            t =>
                String(t.id) ===
                String(tournamentId)
        );


    const teamA =
        teams.find(
            t =>
                String(t.id) ===
                String(teamAId)
        );


    const teamB =
        teams.find(
            t =>
                String(t.id) ===
                String(teamBId)
        );


    if (
        !tournament ||
        !teamA ||
        !teamB
    ) {

        alert(
            "Tournament or team not found."
        );

        return;
    }


    const fixture = {

        id: Date.now(),

        tournamentId:
            tournament.id,

        tournamentName:
            tournament.name,
     sport:
            tournament.sport,

        teamAId:
            teamA.id

        teamA:
            teamA.name,

        teamBId:
            teamB.id,

        teamB:
            teamB.name,

        date:
            date,

        time:
            time,

        venue:
            venue,

        status:
            "Upcoming",

        scoreA:
            0,

        scoreB:
            0
    };


    fixtures.push(fixture);


    localStorage.setItem(
        "magFixtures",
        JSON.stringify(fixtures)
    );


    document.getElementById("teamA").value = "";

    document.getElementById("teamB").value = "";

    document.getElementById("matchDate").value = "";

    document.getElementById("matchTime").value = "";

    document.getElementById("venue").value = "";


    displayFixtures();
}


/* Delete fixture */

function deleteFixture(id) {

    if (
        !confirm(
            "Delete this fixture?"
        )
    ) {

        return;
    }


    fixtures =
        fixtures.filter(
            fixture =>
                fixture.id !== id
        );


    localStorage.setItem(
        "magFixtures",
        JSON.stringify(fixtures)
    );


    displayFixtures();
}


/* Display fixtures */

function displayFixtures() {

    const list =
        document.getElementById("fixtureList");


    if (fixtures.length === 0) {

        list.innerHTML =
            '<div class="empty">No fixtures created yet.</div>';

        return;
    }


    list.innerHTML = "";


    fixtures.forEach(fixture => {

        const card =
            document.createElement("div");

        card.className =
            "fixture";


        card.innerHTML = `

            <h3>
                🏆 ${fixture.tournamentName}
            </h3>


            <div class="teams">

                ${fixture.teamA}

                <span class="vs">
                    VS
                </span>

                ${fixture.teamB}

            </div>


            <div class="info">

                📅 Date:
                ${fixture.date}

                <br>

                ⏰ Time:
                ${fixture.time}

                <br>

                📍 Venue:
                ${fixture.venue}

                <br>

                🟢 Status:
                ${fixture.status}

            </div>


            <button
                class="delete-btn"
                onclick="deleteFixture(${fixture.id})">

                Delete

            </button>

        `;


        list.appendChild(card);

    });
}


/* Start page */

loadTournaments();

displayFixtures();

</script>

</body>
            </html>
