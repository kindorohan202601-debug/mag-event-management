<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAG - Team Management</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #22c55e;
}

.back-btn {
    background: #374151;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    margin-bottom: 30px;
}

.form-box h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

.add-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #16a34a;
}

.team-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.team-card h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.info {
    color: #6b7280;
    line-height: 1.8;
}

.delete-btn {
    margin-top: 15px;
    background: #ef4444;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 30px;
    background: white;
    border-radius: 15px;
}

@media (max-width: 600px) {
    .container {
        margin: 15px auto;
        padding: 15px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        MA<span>G</span>
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Dashboard
    </a>

</header>

<div class="container">

    <h1>👥 Team Management</h1>

    <p class="subtitle">
        Add and manage teams participating in your tournaments.
    </p>


    <div class="form-box">

        <h2>➕ Add Team</h2>

        <label>Select Tournament</label>

        <select id="tournament">
            <option value="">Select Tournament</option>
        </select>


        <label>Team Name</label>

        <input
            type="text"
            id="teamName"
            placeholder="Example: Bundapani FC"
        >


        <label>Team Manager</label>

        <input
            type="text"
            id="manager"
            placeholder="Example: Rohan"
        >


        <label>Manager Contact</label>

        <input
            type="tel"
            id="contact"
            placeholder="Example: 9876543210"
        >


        <button class="add-btn" onclick="addTeam()">
            Add Team
        </button>

    </div>


    <h2>📋 Registered Teams</h2>

    <br>

    <div id="teamList"></div>

</div>


<script>

let tournaments =
    JSON.parse(localStorage.getItem("magTournaments")) || [];

let teams =
    JSON.parse(localStorage.getItem("magTeams")) || [];


/* Load tournaments into dropdown */

function loadTournaments() {

    const select =
        document.getElementById("tournament");

    select.innerHTML =
        '<option value="">Select Tournament</option>';

    tournaments.forEach(tournament => {

        const option =
            document.createElement("option");

        option.value = tournament.id;

        option.textContent =
            tournament.name + " - " + tournament.sport;

        select.appendChild(option);
    });
}


/* Add new team */

function addTeam() {

    const tournamentId =
        document.getElementById("tournament").value;

    const teamName =
        document.getElementById("teamName").value.trim();

    const manager =
        document.getElementById("manager").value.trim();

    const contact =
        document.getElementById("contact").value.trim();


    if (!tournamentId ||
        !teamName ||
        !manager ||
        !contact) {

        alert("Please fill in all team details.");

        return;
    }


    const tournament =
        tournaments.find(
            t => t.id == tournamentId
        );


    if (!tournament) {

        alert("Tournament not found.");

        return;
    }


    const team = {

        id: Date.now(),

        tournamentId: tournament.id,

        tournamentName: tournament.name,

        name: teamName,

        manager: manager,

        contact: contact
    };


    teams.push(team);


    localStorage.setItem(
        "magTeams",
        JSON.stringify(teams)
    );


    document.getElementById("teamName").value = "";

    document.getElementById("manager").value = "";

    document.getElementById("contact").value = "";


    displayTeams();
}


/* Delete team */

function deleteTeam(id) {

    if (!confirm("Delete this team?")) {

        return;
    }


    teams =
        teams.filter(
            team => team.id !== id
        );


    localStorage.setItem(
        "magTeams",
        JSON.stringify(teams)
    );


    displayTeams();
}


/* Display teams */

function displayTeams() {

    const list =
        document.getElementById("teamList");


    if (teams.length === 0) {

        list.innerHTML =
            '<div class="empty">No teams registered yet.</div>';

        return;
    }


    list.innerHTML = "";


    teams.forEach(team => {

        const card =
            document.createElement("div");

        card.className = "team-card";


        card.innerHTML = `

            <h3>👥 ${team.name}</h3>

            <div class="info">

                🏆 Tournament:
                ${team.tournamentName}
                <br>

                👤 Manager:
                ${team.manager}
                <br>

                📞 Contact:
                ${team.contact}

            </div>


            <button
                class="delete-btn"
                onclick="deleteTeam(${team.id})">

                Delete

            </button>

        `;


        list.appendChild(card);

    });
}


/* Start page */

loadTournaments();

displayTeams();

</script>

</body>
</html>
