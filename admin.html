<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAG Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #22c55e;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MA<span>G</span></div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Multi-Sport Event Management
    </p>

    <form id="loginForm">

      <label>Admin Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "admin" && password === "MAG123") {
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("message").textContent =
          "Incorrect username or password";
      }

    });
  </script>

</body>
</html>
